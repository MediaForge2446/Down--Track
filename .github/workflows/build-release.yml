name: Build & Release DownTrack

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore DownTrack.sln

      # 1. בניית התוכנה הראשית עצמאית ומלאה (כולל .NET 8 בפנים)
      - name: Build Core & App
        run: dotnet publish src/DownTrack/DownTrack.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/app

      # 2. הורדת כלי המנוע (yt-dlp, FFmpeg)
      - name: Download Engine Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path publish/app/bin
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile publish/app/bin/yt-dlp.exe
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_temp
          $ffmpegFolder = Get-ChildItem -Directory ffmpeg_temp | Select-Object -First 1
          Copy-Item "$($ffmpegFolder.FullName)/bin/ffmpeg.exe" -Destination publish/app/bin/ffmpeg.exe
          Copy-Item "$($ffmpegFolder.FullName)/bin/ffprobe.exe" -Destination publish/app/bin/ffprobe.exe
          Remove-Item -Recurse -Force ffmpeg.zip, ffmpeg_temp

      # 3. אריזת החבילה המלאה (FullPackage.zip)
      - name: Zip Full Package
        shell: pwsh
        run: |
          Compress-Archive -Path publish/app/* -DestinationPath DownTrack-FullPackage.zip

      # 4. בניית המתקין הקל (Native Win32 - פחות מ-1MB)
      - name: Build Lightweight WebSetup
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if not exist publish\setup mkdir publish\setup
          cd src\DownTrack.WebSetup
          rc.exe /fo setup.res setup.rc
          cl.exe /O2 /W3 /EHsc main.cpp setup.res /Fe:..\..\publish\setup\DownTrack.WebSetup.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib shell32.lib comctl32.lib winhttp.lib ole32.lib advapi32.lib

      # 5. יצירת GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            DownTrack-FullPackage.zip
            publish/setup/DownTrack.WebSetup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
